<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Erklärvideo – Monteurzimmerblick</title>
  <meta name="description" content="In einer Minute erklärt: Wie Vermieter von Monteurzimmern mit ihren Kunden zusätzlich verdienen.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0E0E0D">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/fonts/fonts.css">
  <!--
    Quelle des Erklärvideos (Motion Graphics, 1920×1080, ca. 55 s).
    Die Animation ist eine pausierte GSAP-Timeline und wird bildgenau gerendert:
    ?export=1 blendet die Steuerung aus, window.__render(t) setzt jedes Bild.
    Sprecher: assets/video/sprecher.mp3 (eine Aufnahme, per VO_SEGS geschnitten).
    Die fertige Datei mit Ton ist assets/video/erklaervideo.mp4.
  -->
  <style>
    :root { --gelb: #F5B800; --ink: #0E0E0D; --bg: #F6F6F3; --ff: 'Inter', system-ui, sans-serif; --ff-tight: 'Inter Tight', 'Inter', sans-serif; --ff-mono: 'IBM Plex Mono', monospace; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: #0E0E0D; font-family: var(--ff); color: var(--ink); }
    body { display: grid; place-items: center; overflow: hidden; }
    .player { position: relative; width: 100vw; height: 100vh; display: grid; place-items: center; }
    .viewport { position: relative; width: min(100vw, 177.78vh); aspect-ratio: 16 / 9; overflow: hidden; background: var(--bg); }
    .stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden; background: var(--bg); }
    .layer { position: absolute; inset: 0; width: 1920px; height: 1080px; visibility: hidden; }
    .layer > svg, .cam > svg { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: visible; }
    .cam { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; }
    svg text { font-family: var(--ff-tight); font-weight: 800; letter-spacing: -.02em; }
    svg .mono { font-family: var(--ff-mono); font-weight: 500; letter-spacing: 0; }
    svg .ui { font-family: var(--ff); font-weight: 600; letter-spacing: 0; }

    /* Einblendungen (Bildschirmebene, unabhängig von der Kamera) */
    .cap { position: absolute; font-family: var(--ff-tight); font-weight: 800; letter-spacing: -.035em; line-height: 1.02; color: var(--ink); white-space: nowrap; }
    .cap .ln { display: block; }
    .cap .m { display: inline-block; overflow: hidden; vertical-align: top; padding: 0 .04em .24em; margin: 0 -.04em -.24em; }
    .cap .w { display: inline-block; }
    .cap .hl { position: relative; }
    .cap .hl::before { content: ""; position: absolute; left: -.08em; right: -.08em; bottom: .08em; height: .42em; background: var(--gelb); z-index: -1; transform-origin: 0 50%; transform: scaleX(var(--hl, 0)); }
    #caps { position: absolute; inset: 0; z-index: 10; pointer-events: none; }
    .wipe { z-index: 11; position: absolute; top: -200px; height: 1480px; width: 2600px; background: var(--gelb); left: 2000px; transform: skewX(-12deg); visibility: hidden; }
    .wipe.ink { background: var(--ink); }
    .cover-sq { z-index: 12; position: absolute; left: 910px; top: 490px; width: 100px; height: 100px; border-radius: 20px; background: var(--gelb); visibility: hidden; }

    /* Steuerung für die Vorschau im Browser */
    .play-cover { position: absolute; inset: 0; z-index: 20; display: grid; place-items: center; background: rgba(14,14,13,.28); border: 0; cursor: pointer; padding: 0; }
    .play-cover span { width: 96px; height: 96px; border-radius: 50%; background: var(--gelb); display: grid; place-items: center; box-shadow: 0 0 0 16px rgba(255,255,255,.35); }
    .play-cover svg { width: 34px; height: 34px; margin-left: 5px; }
    .play-cover.hidden { display: none; }
    .bar { position: absolute; left: 0; right: 0; bottom: 0; z-index: 15; display: flex; align-items: center; gap: 12px; padding: 10px 14px; background: linear-gradient(transparent, rgba(14,14,13,.7)); color: #fff; font-size: 13px; font-variant-numeric: tabular-nums; opacity: 0; transition: opacity .25s; }
    .player:hover .bar, .player.paused .bar { opacity: 1; }
    .bar button { width: 36px; height: 36px; border: 0; border-radius: 8px; background: rgba(255,255,255,.16); color: #fff; cursor: pointer; font: inherit; }
    .bar .prog { flex: 1; height: 24px; display: flex; align-items: center; cursor: pointer; }
    .bar .prog i { display: block; width: 100%; height: 6px; border-radius: 3px; background: rgba(255,255,255,.25); position: relative; overflow: hidden; }
    .bar .prog b { position: absolute; inset: 0 auto 0 0; width: 0; background: var(--gelb); }
    .export .bar, .export .play-cover { display: none !important; }
  </style>
</head>
<body>
<div class="player paused" id="player">
  <div class="viewport" id="viewport">
    <div class="stage" id="stage">
      <div class="layer" id="L-street"><svg id="S-street" viewBox="0 0 1920 1080"></svg></div>
      <div class="layer" id="L-phone"><svg id="S-phone" viewBox="0 0 1920 1080"></svg></div>
      <div class="layer" id="L-map"><div class="cam" id="mapcam"><svg id="S-map" viewBox="0 0 1920 1080"></svg></div></div>
      <div class="layer" id="L-hh"><svg id="S-hh" viewBox="0 0 1920 1080"></svg></div>
      <div class="layer" id="L-recap"><svg id="S-recap" viewBox="0 0 1920 1080"></svg></div>
      <div class="layer" id="L-cta"><svg id="S-cta" viewBox="0 0 1920 1080"></svg></div>
      <div id="caps"></div>
      <div class="wipe" id="wipe"></div>
      <div class="cover-sq" id="coverSq"></div>
    </div>
  </div>
  <button class="play-cover" id="playCover" type="button" aria-label="Video abspielen"><span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l12-7.5z" fill="#0E0E0D"/></svg></span></button>
  <div class="bar">
    <button type="button" id="btnPlay" aria-label="Abspielen / Pause">▶</button>
    <div class="prog" id="prog"><i><b id="progFill"></b></i></div>
    <span id="time">0:00</span>
  </div>
  <audio id="audio" preload="auto" src="assets/video/erklaervideo.mp4"></audio>
</div>

<script src="assets/video/lib/gsap.min.js"></script>
<script src="assets/video/lib/DrawSVGPlugin.min.js"></script>
<script src="assets/video/lib/MotionPathPlugin.min.js"></script>
<script src="assets/video/lib/CustomEase.min.js"></script>
<script>
(function () {
  'use strict';
  gsap.registerPlugin(DrawSVGPlugin, MotionPathPlugin, CustomEase);

  var INK = '#0E0E0D', Y = '#F5B800', WH = '#FFFFFF', BG = '#F6F6F3', G1 = '#EDEDE8', G2 = '#E4E4DF', G3 = '#D2D2CC', G4 = '#7A7A74', DK = '#3A3A36';
  var SK = 'stroke="' + INK + '" stroke-linejoin="round" stroke-linecap="round"';
  var DURATION = 55.6;
  var MARK = { x: 0, y: 0 };
  var T = {};   /* Zeitpunkte für Zustände, die render() direkt setzt */

  /* ================= Sprecher: eine Aufnahme, in Sätze geschnitten ================= */
  /* [von, bis] in der Aufnahme -> Start auf der Timeline (Sekunden) */
  var VO_SEGS = [
    [0.20, 4.40, 0.60],    // Das ist Herr Berger. Er vermietet Monteurzimmer in Magdeburg.
    [4.80, 9.62, 5.15],    // Seine Kunden sind zufrieden. Doch die Baustelle zieht weiter – nach Hamburg.
    [10.36, 12.30, 10.55], // Dort hat Herr Berger kein Zimmer.
    [12.80, 16.05, 12.95], // Früher war die Anfrage damit weg. Und das Geld auch.
    [16.45, 20.42, 17.55], // Heute gibt er sie einfach weiter – mit Monteurzimmerblick.
    [20.72, 24.12, 22.75], // Eine geprüfte Vermieterin in Hamburg übernimmt den Kunden.
    [24.52, 25.98, 26.95], // Und Herr Berger verdient mit.
    [26.52, 28.78, 29.65], // Ohne ein einziges neues Zimmer.
    [29.40, 36.28, 32.55], // Und umgekehrt: … kauft er Anfragen aus seiner Stadt. So sind sie schnell wieder belegt.
    [36.52, 40.20, 40.15], // Weitergeben. Mitverdienen. Leerstand füllen.
    [40.62, 42.92, 44.25], // So holen Sie mehr aus jedem Kunden.
    [43.46, 48.64, 47.25]  // Monteurzimmerblick. Jetzt kostenlos starten – auf monteurzimmerblick punkt de.
  ];
  /* Wortanfänge laut Transkription (Sekunden in der Aufnahme) */
  var WORDS = 'Das .28|ist .72|Herr .92|Berger 1.12|Er 2.16|vermietet 2.28|Monteurzimmer 2.72|in 3.52|Magdeburg 3.70|Seine 4.96|Kunden 5.20|sind 5.58|zufrieden 5.82|doch 6.86|die 7.06|Baustelle 7.26|zieht 7.88|weiter 8.10|nach 8.88|Hamburg 9.10|Dort 10.46|hat 10.76|Herr 10.96|Berger 11.16|kein 11.56|Zimmer 11.88|Früher 12.92|war 13.28|die 13.42|Anfrage 13.62|damit 14.14|weg 14.44|und 15.24|das 15.34|Geld 15.52|auch 15.80|Heute 16.82|gibt 17.34|er 17.52|sie 17.64|einfach 17.84|weiter 18.20|mit 18.96|Monteurzimmerblick 19.34|Eine 21.16|geprüfte 21.36|Vermieterin 21.94|in 22.52|Hamburg 22.68|übernimmt 23.22|den 23.60|Kunden 23.76|und 24.60|Herr 24.74|Berger 24.94|verdient 25.38|mit 25.74|ohne 26.62|ein 27.00|einziges 27.32|neues 27.96|Zimmer 28.38|Und 29.48|umgekehrt 29.62|Stehen 30.70|bei 31.02|ihm 31.28|Zimmer 31.54|leer 31.84|kauft 32.46|er 32.80|Anfragen 32.98|aus 33.52|seiner 33.72|Stadt 34.02|So 35.00|sind 35.14|sie 35.26|schnell 35.38|wieder 35.62|belegt 35.82|Weitergeben 37.04|mitverdienen 38.16|Leerstand 39.28|füllen 39.78|So 40.76|holen 40.92|Sie 41.18|mehr 41.44|aus 41.78|jedem 42.08|Kunden 42.44|Monteurzimmerblick 43.54|jetzt 45.04|kostenlos 45.42|starten 45.98|auf 46.74|monteurzimmerblick.de 46.90'
    .split('|').map(function (s) { var p = s.split(' '); return [p[0].toLowerCase(), parseFloat(p[1])]; });

  function vt(src) {
    for (var i = 0; i < VO_SEGS.length; i++) {
      var s = VO_SEGS[i];
      if (src >= s[0] - 0.001 && src <= s[1] + 0.001) return s[2] + (src - s[0]);
    }
    throw new Error('Zeit ausserhalb der Schnitte: ' + src);
  }
  /* Zeitpunkt eines gesprochenen Wortes auf der Timeline, z. B. at('Hamburg', 2) */
  function at(word, n) {
    n = n || 1; word = word.toLowerCase();
    for (var i = 0, c = 0; i < WORDS.length; i++) {
      if (WORDS[i][0] === word && ++c === n) return vt(WORDS[i][1]);
    }
    throw new Error('Wort nicht gefunden: ' + word + ' #' + n);
  }

  /* ================= Geräusche (werden beim Export gemischt) ================= */
  var SFX = [];
  function sfx(name, t, gain) { SFX.push({ name: name, t: +t.toFixed(3), gain: gain == null ? 1 : gain }); }

  /* ================= SVG-Helfer ================= */
  function $(id) { return document.getElementById(id); }
  function put(svgId, markup) { $(svgId).insertAdjacentHTML('beforeend', markup); }
  function q(sel) { return document.querySelector(sel); }

  function starPath(r) {
    var d = '', i, a, rr;
    for (i = 0; i < 10; i++) { a = -Math.PI / 2 + i * Math.PI / 5; rr = i % 2 ? r * 0.46 : r; d += (i ? 'L' : 'M') + (Math.cos(a) * rr).toFixed(1) + ',' + (Math.sin(a) * rr).toFixed(1); }
    return d + 'Z';
  }
  function star(id, x, y, r) {

  }
  function logoMark(id) {
    return '<g id="' + id + '"><rect width="100" height="100" rx="20" fill="' + Y + '"/>' +
      '<g transform="rotate(-18 50 50)">' +
      '<rect class="t1" x="5" y="43" width="20" height="14" rx="3" fill="' + INK + '"/>' +
      '<rect class="t2" x="27" y="39" width="26" height="22" rx="3" fill="' + INK + '"/>' +
      '<g class="t3"><rect x="55" y="31" width="38" height="38" rx="5" fill="' + INK + '"/><circle cx="79" cy="50" r="9.5" fill="' + Y + '"/><circle cx="82" cy="47" r="2.8" fill="' + INK + '"/></g>' +
      '</g></g>';
  }
  function helmetIcon(x, y, s) {
    return '<g transform="translate(' + x + ',' + y + ') scale(' + s + ')"><path d="M-26,4 A26 26 0 0 1 26,4 Z" fill="' + Y + '" ' + SK + ' stroke-width="4"/><rect x="-32" y="0" width="64" height="10" rx="5" fill="' + INK + '"/><path d="M0,-22 V-8" ' + SK + ' stroke-width="4"/></g>';
  }
  /* Anfrage-Karte, Mittelpunkt 0,0, Größe 330×196 */
  function requestCard(id, city, sub, label) {
    return '<g id="' + id + '">' +
      '<rect x="-165" y="-98" width="330" height="196" rx="24" fill="' + Y + '" ' + SK + ' stroke-width="6"/>' +
      '<text x="-137" y="-50" font-size="19" class="ui" style="font-weight:700;letter-spacing:.12em">' + (label || 'ANFRAGE') + '</text>' +
      helmetIcon(122, -58, 0.7) +
      '<text x="-137" y="18" font-size="56">' + city + '</text>' +
      '<text x="-137" y="62" font-size="23" class="ui" style="font-weight:600">' + sub + '</text>' +
      '</g>';
  }
  function banknote(id) {
    return '<g id="' + id + '"><rect x="-80" y="-44" width="160" height="88" rx="10" fill="' + WH + '" ' + SK + ' stroke-width="5"/>' +
      '<rect x="-66" y="-31" width="132" height="62" rx="6" fill="none" stroke="' + INK + '" stroke-width="3"/>' +
      '<circle r="24" fill="' + Y + '" ' + SK + ' stroke-width="4"/>' +
      '<text y="11" text-anchor="middle" font-size="32">€</text></g>';
  }
  function coin(id) {
    return '<g id="' + id + '"><circle r="40" fill="' + Y + '" ' + SK + ' stroke-width="6"/><circle r="29" fill="none" stroke="' + INK + '" stroke-width="3"/>' +
      '<text y="15" text-anchor="middle" font-size="44">€</text></g>';
  }
  function mapPin(id, x, y, label, side) {
    var lx = side === 'left' ? -28 - 24 : 28 + 24;
    var w = label.length * 19 + 56;
    var rx = side === 'left' ? lx - w : lx;
    return '<g transform="translate(' + x + ',' + y + ')"><g id="' + id + '">' +
      '<g class="pin"><path d="M0,0 C-8,-18 -28,-30 -28,-54 A28 28 0 0 1 28,-54 C28,-30 8,-18 0,0 Z" fill="' + INK + '" ' + SK + ' stroke-width="4"/><circle cy="-54" r="11" fill="' + Y + '"/></g>' +
      (label ? '<g class="lbl"><rect x="' + rx + '" y="-84" width="' + w + '" height="58" rx="29" fill="' + WH + '" ' + SK + ' stroke-width="5"/><text x="' + (rx + w / 2) + '" y="-44" text-anchor="middle" font-size="31">' + label + '</text></g>' : '') +
      '</g></g>';
  }

  /* ================= Figuren (Rig) ================= */
  var CHARS = [];
  var LOOK = {
    berger: { skin: '#F1C7A1', top: DK, sleeve: WH, pants: G4, eyeY: -436 },
    worker: { skin: '#9A6440', top: DK, sleeve: DK, pants: G4, eyeY: -422 },
    lady:   { skin: '#6E4630', top: WH, sleeve: WH, pants: DK, eyeY: -434 }
  };
  function charSVG(id, type) {
    var L = LOOK[type], s5 = SK + ' stroke-width="5"';
    function arm(side) {
      var extra = '';
      if (type === 'worker') extra = '<rect x="-14" y="44" width="28" height="12" fill="' + Y + '" ' + SK + ' stroke-width="3.5"/>';
      return '<g id="' + id + '-arm' + side + '">' +
        '<rect x="-15" y="-12" width="30" height="96" rx="15" fill="' + L.sleeve + '" ' + s5 + '/>' +
        '<g id="' + id + '-fore' + side + '">' +
        '<rect x="-14" y="-10" width="28" height="86" rx="14" fill="' + (type === 'lady' ? L.skin : L.sleeve) + '" ' + s5 + '/>' + extra +
        '<g id="' + id + '-hold' + side + '" transform="translate(0,78)"></g>' +
        '<circle cx="0" cy="78" r="17" fill="' + L.skin + '" ' + s5 + '/>' +
        '</g></g>';
    }
    function leg(side) {
      return '<g id="' + id + '-leg' + side + '">' +
        '<rect x="-18" y="-10" width="36" height="166" rx="18" fill="' + L.pants + '" ' + s5 + '/>' +
        '<path d="M-24,152 Q-24,146 -16,146 L20,146 Q46,146 46,168 L46,178 L-24,178 Z" fill="' + INK + '" ' + s5 + '/>' +
        '</g>';
    }
    var torso = '<path d="M-58,-340 Q-58,-366 -32,-366 L32,-366 Q58,-366 58,-340 L54,-196 Q54,-182 40,-182 L-40,-182 Q-54,-182 -54,-196 Z" fill="' + L.top + '" ' + s5 + '/>';
    if (type === 'berger') torso += '<path d="M-30,-366 L0,-300 L30,-366 Z" fill="' + WH + '" ' + SK + ' stroke-width="4"/><path d="M-30,-366 L-14,-348 L0,-362 L14,-348 L30,-366" fill="' + WH + '" ' + SK + ' stroke-width="4"/><path d="M0,-352 L-7,-340 L0,-306 L7,-340 Z" fill="' + Y + '" ' + SK + ' stroke-width="3"/><circle cx="-4" cy="-272" r="4.5" fill="' + WH + '"/><circle cx="-4" cy="-238" r="4.5" fill="' + WH + '"/>';
    if (type === 'worker') torso += '<rect x="-56" y="-300" width="112" height="18" fill="' + Y + '" ' + SK + ' stroke-width="4"/><rect x="-55" y="-248" width="110" height="18" fill="' + Y + '" ' + SK + ' stroke-width="4"/>';
    if (type === 'lady') torso += '<path d="M-28,-368 L28,-368 L6,-322 Z" fill="' + Y + '" ' + SK + ' stroke-width="4"/>';
    var back = '', front = '';
    if (type === 'berger') {
      back = '<circle cx="-46" cy="-428" r="11" fill="' + L.skin + '" ' + s5 + '/>';
      front = '<path d="M-52,-412 C-64,-470 -26,-494 8,-484 C-16,-470 -28,-448 -30,-420 C-38,-414 -46,-410 -52,-412 Z" fill="' + G3 + '" ' + SK + ' stroke-width="4.5"/>' +
        '<path d="M22,-414 Q33,-423 46,-414 Q34,-407 22,-414 Z" fill="' + G3 + '" ' + SK + ' stroke-width="3.5"/>' +
        '<circle cx="14" cy="' + L.eyeY + '" r="13" fill="none" ' + SK + ' stroke-width="4"/><circle cx="41" cy="' + L.eyeY + '" r="13" fill="none" ' + SK + ' stroke-width="4"/><path d="M1,' + (L.eyeY - 2) + ' L-40,' + (L.eyeY + 2) + '" ' + SK + ' stroke-width="4"/>';
    }
    if (type === 'worker') {
      front = '<path d="M-60,-438 A60 60 0 0 1 60,-438 Z" fill="' + Y + '" ' + s5 + '/><rect x="-64" y="-446" width="142" height="16" rx="8" fill="' + Y + '" ' + s5 + '/><path d="M0,-494 V-450" ' + SK + ' stroke-width="4.5"/>' +
        '<path d="M-40,-404 Q-20,-372 20,-376 Q44,-380 52,-404" fill="none" ' + SK + ' stroke-width="4" opacity=".0"/>';
      back = '<circle cx="-46" cy="-418" r="11" fill="' + L.skin + '" ' + s5 + '/>';
    }
    if (type === 'lady') {
      back = '<circle cx="-22" cy="-488" r="26" fill="' + INK + '" ' + s5 + '/>';
      front = '<path d="M-55,-418 C-62,-486 34,-506 56,-446 C34,-464 -6,-470 -32,-444 L-38,-404 C-46,-404 -52,-410 -55,-418 Z" fill="' + INK + '" ' + SK + ' stroke-width="4.5"/><circle cx="-40" cy="-400" r="6" fill="' + Y + '" ' + SK + ' stroke-width="3"/>';
    }
    var ey = L.eyeY;
    var face = '<g id="' + id + '-eyes"><circle cx="14" cy="' + ey + '" r="5.5" fill="' + INK + '"/><circle cx="41" cy="' + ey + '" r="5.5" fill="' + INK + '"/></g>' +
      '<path d="M46,' + (ey + 8) + ' q7,6 0,11" fill="none" ' + SK + ' stroke-width="4"/>' +
      '<path d="M18,' + (ey + 30) + ' Q30,' + (ey + 40) + ' 42,' + (ey + 29) + '" fill="none" ' + SK + ' stroke-width="4.5"/>';
    var bag = type === 'worker' ? '<g id="' + id + '-bag"></g>' : '';
    return '<g id="' + id + '">' +
      '<ellipse id="' + id + '-shadow" cx="4" cy="2" rx="84" ry="13" fill="' + INK + '" opacity=".08"/>' +
      '<g id="' + id + '-body">' +
      '<g id="' + id + '-legB" transform="translate(-24,-178)">' + leg('B') + '</g>' +
      '<g id="' + id + '-legF" transform="translate(24,-178)">' + leg('F') + '</g>' +
      '<g id="' + id + '-upper">' +
      '<g id="' + id + '-armBw" transform="translate(-50,-344)">' + arm('B') + '</g>' +
      torso +
      '<rect x="-13" y="-386" width="26" height="30" fill="' + L.skin + '" ' + s5 + '/>' +
      '<g id="' + id + '-head">' + back + '<circle cx="0" cy="-430" r="54" fill="' + L.skin + '" ' + s5 + '/>' + face + front + '</g>' +
      '<g id="' + id + '-armFw" transform="translate(50,-344)">' + arm('F') + '</g>' +
      bag +
      '</g></g></g>';
  }
  function makeChar(svgId, id, type, p) {
    put(svgId, '<g id="' + id + '-root">' + charSVG(id, type) + '</g>');
    var c = {
      id: id, seed: CHARS.length * 1.7,
      root: $(id + '-root'), upper: $(id + '-upper'), head: $(id + '-head'), eyes: $(id + '-eyes'),
      legF: $(id + '-legF'), legB: $(id + '-legB'), armF: $(id + '-armFw'), armB: $(id + '-armBw'),
      foreF: $(id + '-foreF'), foreB: $(id + '-foreB'), shadow: $(id + '-shadow'),
      p: Object.assign({ x: 0, y: 0, s: 1, face: 1, sy: 1, op: 1, bob: 0, lean: 0, head: 0, headY: 0,
        legF: 0, legB: 0, armFu: -7, armFl: 8, armBu: 7, armBl: -8, walkPhase: 0, walkAmp: 0, blink: 1 }, p || {})
    };
    CHARS.push(c);
    return c;

    tl.fromTo('#mapCard', { scale: 0.7, opacity: 0, y: -520, rotation: 14 }, { scale: 0.42, opacity: 1, y: 0, rotation: 0, duration: 0.5, ease: 'back.out(1.4)' }, tm + 0.05);
    sfx('pop', tm + 0.5, 0.5);
    var tf = tm + 0.6;
    tl.to('#mapCardW', { motionPath: { path: ARC_MH_C }, duration: 1.1, ease: 'power2.inOut' }, tf);
    tl.fromTo('#trail1', { drawSVG: '0%' }, { drawSVG: '100%', duration: 1.1, ease: 'power2.inOut' }, tf);
    tl.to('#mapCard', { rotation: -8, duration: 0.55, ease: 'sine.inOut', yoyo: true, repeat: 1 }, tf);
    sfx('whoosh', tf + 0.1, 0.7);
    tl.to('#mapCard', { scale: 0.5, duration: 0.12, ease: 'power2.out' }, tf + 1.1);
    tl.to('#mapCard', { scale: 0.42, duration: 0.4, ease: 'back.out(3)' }, tf + 1.22);
    sfx('pop', tf + 1.1, 0.6);
  })();

  /* ---------- Szene 5: Geprüfte Vermieterin in Hamburg ---------- */
  (function () {
    var t = at('Eine') - 0.55;
    mapCam(HH[0], HH[1] - 40, 4.2, t - 0.1, 0.8, 'power3.in');
    show('#L-hh', t + 0.2);
    tl.fromTo('#L-hh', { clipPath: 'circle(0px at 960px 420px)' }, { clipPath: 'circle(2300px at 960px 420px)', duration: 0.75, ease: 'power3.inOut' }, t + 0.2);
    hideAt('#L-map', t + 0.95);
    sfx('whoosh', t + 0.15, 0.7);
    pop('#pinHH', t + 0.5, { origin: '50% 100%' });
    popChar(LD, t + 0.3); sfx('pop', t + 0.3, 0.5);
    wave(LD, at('Vermieterin') + 0.05, 1, 'F');
    pop('#badge', at('geprüfte') + 0.9, { rot: -30, dur: 0.6 }); sfx('pop', at('geprüfte') + 0.9, 0.7);
    capIn('capGeprueft', at('geprüfte') + 0.05);
    /* Karte kommt geflogen und wird gefangen */
    var tc = at('übernimmt');
    gsap.set('#hhCard', { opacity: 0, x: 900, y: -420, scale: 0.5 });
    tl.set('#hhCard', { opacity: 1 }, tc - 0.7);
    tl.to('#hhCard', { motionPath: { path: [{ x: 900, y: -420 }, { x: 380, y: -260 }, { x: 0, y: 0 }], curviness: 1.2 }, rotation: -6, duration: 0.75, ease: 'power2.out' }, tc - 0.7);
    sfx('whoosh', tc - 0.7, 0.5);
    tl.to(LD.p, { armFu: -125, armFl: -18, armBu: -115, armBl: -10, head: -10, duration: 0.35, ease: 'back.out(2)' }, tc - 0.4);
    hop(LD, tc + 0.05, 24);
    tl.to('#hhCard', { y: 16, duration: 0.14, ease: 'power2.out' }, tc + 0.05);
    tl.to('#hhCard', { y: 0, duration: 0.3, ease: 'back.out(3)' }, tc + 0.19);
    sfx('pop', tc + 0.05, 0.6);
    capOut('capGeprueft', at('Kunden', 2) + 0.2);
    /* Der Kunde kommt an */
    walk(WK2, tc + 0.1, 0.9, 1330, 0.28);
    wave(WK2, tc + 1.05, 1, 'F');
    tl.to('#hhCard', { y: 300, x: -470, scale: 0.12, opacity: 0, duration: 0.45, ease: 'power3.in' }, tc + 0.8);
    tl.to(LD.p, { armFu: -7, armFl: 8, armBu: 7, armBl: -8, head: 0, duration: 0.4 }, tc + 0.85);
    wave(LD, tc + 1.2, 1, 'F');
  })();

  /* ---------- Szene 6: Herr Berger verdient mit ---------- */
  (function () {
    var t = at('und', 2) - 0.5;
    show('#L-map', t);
    tl.set('#mapCard', { opacity: 0 }, t);
    tl.to('#L-hh', { clipPath: 'circle(0px at 960px 420px)', duration: 0.6, ease: 'power3.in' }, t);
    hideAt('#L-hh', t + 0.6);
    sfx('whoosh', t, 0.6);
    mapCam(MAPV[0], MAPV[1], MAPV[2], t + 0.15, 0.8, 'power3.out');
    gsap.set('#mapNoteW', { x: HHc[0], y: HHc[1] });
    var tn = t + 0.55;
    tl.fromTo('#mapNote', { scale: 0, opacity: 0 }, { scale: 0.62, opacity: 1, duration: 0.4, ease: 'back.out(2.4)' }, tn);
    sfx('pop', tn, 0.5);
    tl.to('#mapNoteW', { motionPath: { path: ARC_HM_C }, duration: 1.1, ease: 'power2.inOut' }, tn + 0.2);
    tl.to('#mapNote', { rotation: 10, duration: 0.55, ease: 'sine.inOut', yoyo: true, repeat: 1 }, tn + 0.2);
    tl.fromTo('#trail2', { drawSVG: '0%' }, { drawSVG: '100%', duration: 1.1, ease: 'power2.inOut' }, tn + 0.2);
    sfx('whoosh', tn + 0.25, 0.6);
    var tland = tn + 1.3;
    tl.to('#mapNote', { scale: 0.5, duration: 0.3, ease: 'back.out(3)' }, tland);
    tl.fromTo('#burst .ray', { drawSVG: '0% 0%' }, { drawSVG: '0% 100%', duration: 0.25, ease: 'power2.out' }, tland);
    tl.to('#burst .ray', { drawSVG: '100% 100%', duration: 0.3, ease: 'power2.in' }, tland + 0.25);
    pop('#plusGeld', tland + 0.05, { origin: '0% 50%' });
    sfx('ding', tland, 1);
    /* zurück zu Herrn Berger */
    var tb = tland + 0.6;
    mapCam(MD[0], MD[1] - 20, 4.2, tb - 0.2, 0.7, 'power3.in');
    show('#L-street', tb);
    tl.set('#L-street', { clipPath: 'circle(0px at 960px 460px)', zIndex: 5 }, tb);
    tl.to('#L-street', { clipPath: 'circle(2300px at 960px 460px)', duration: 0.7, ease: 'power3.inOut' }, tb);
    hideAt('#L-map', tb + 0.7);
    sfx('whoosh', tb, 0.6);
    /* Bühne umbauen: Magdeburg ohne Kunde, mit Geld */
    tl.set(WK.p, { op: 0 }, tb - 0.1);
    tl.set('#S-street', { scale: 1 }, tb - 0.05);
    tl.to('#S-street', { scale: 1.04, duration: 9, ease: 'none' }, tb);
    tl.set(B.p, { head: 0, headY: 0, armFu: -30, armFl: -88, face: 1 }, tb - 0.05);
    tl.set('#bNotes', { opacity: 1 }, tb - 0.05);
    gsap.set('#bn2, #bn3', { opacity: 0 });
    var to = at('ohne');
    capIn('capOhne', to);
    tl.fromTo('#bn2', { opacity: 0, y: -60 }, { opacity: 1, y: 2, duration: 0.3, ease: 'back.out(2)', immediateRender: false }, to + 0.45);
    tl.fromTo('#bn3', { opacity: 0, y: -60 }, { opacity: 1, y: 6, duration: 0.3, ease: 'back.out(2)', immediateRender: false }, to + 0.85);
    sfx('pop', to + 0.45, 0.4); sfx('pop', to + 0.85, 0.45);
    nod(B, to + 0.3, 2);
  })();

  /* ---------- Szene 7: Und umgekehrt – Leerstand füllen ---------- */
  (function () {
    var t = at('und', 3) - 0.25;
    tl.to('#L-street', { rotationY: 90, duration: 0.3, ease: 'power2.in', transformPerspective: 2400 }, t);
    sfx('whoosh', t, 0.6);
    capOut('capOhne', t - 0.3);
    /* Umbau während die Bühne auf der Kante steht */
    var tx = t + 0.3;
    tl.set('#bNotes', { opacity: 0 }, tx);
    tl.set(B.p, { armFu: -7, armFl: 8, face: 1, head: 0 }, tx);
    T.flip = tx;
    tl.set('#treeA', { opacity: 0 }, tx);
    tl.fromTo('#L-street', { rotationY: -90 }, { rotationY: 0, duration: 0.45, ease: 'back.out(1.4)', transformPerspective: 2400, immediateRender: false }, tx);
    var tl2 = at('Stehen');
    tl.to(B.p, { head: 8, duration: 0.3 }, tl2);
    tl.fromTo('#tumbleWrap', { x: -120 }, { x: 2100, duration: 2.4, ease: 'none', immediateRender: false }, tl2 - 0.1);
    tl.fromTo('#tumbleRot', { rotation: 0, y: 0 }, { rotation: 720, duration: 2.4, ease: 'none' }, tl2 - 0.1);
    tl.to('#tumbleRot', { y: -26, duration: 0.2, ease: 'power1.out', yoyo: true, repeat: 11 }, tl2 - 0.1);
    tl.to(B.p, { armFu: -40, armFl: -95, armBu: 40, armBl: 95, bob: -5, duration: 0.3, ease: 'back.out(2)' }, at('leer') - 0.1);
    tl.to(B.p, { armFu: -7, armFl: 8, armBu: 7, armBl: -8, bob: 0, head: 0, duration: 0.35 }, at('leer') + 0.6);
    var tk = at('leer') + 0.25;
    pop('#buyCard', tk, { from: 0.4, dur: 0.6 }); sfx('pop', tk, 0.7);
    var tt = at('Stadt') - 0.25;
    tl.to(B.p, { armFu: -110, armFl: -10, duration: 0.3, ease: 'back.out(1.8)' }, tt - 0.35);
    press('#buyBtn', tt); tap('#tap2', tt); sfx('click', tt, 0.9);
    tl.to(B.p, { armFu: -7, armFl: 8, duration: 0.3 }, tt + 0.4);
    tl.to('#buyCard', { scale: 0.18, x: -470, y: 330, opacity: 0, rotation: -20, duration: 0.55, ease: 'power3.in' }, tt + 0.35);
    sfx('whoosh', tt + 0.35, 0.5);
    tl.to('#doorLeaf', { scaleX: 0.12, transformOrigin: '0% 50%', duration: 0.2 }, tt + 0.7);
    tl.to('#doorLeaf', { scaleX: 1, duration: 0.25 }, tt + 1.05);
    var tbel = at('schnell');
    ['#win1', '#win2', '#win3', '#win4'].forEach(function (w, i) {
      var ti = tbel + i * 0.16;
      tl.fromTo(w, { scale: 1.12, transformOrigin: '50% 50%' }, { scale: 1, duration: 0.4, ease: 'back.out(3)', immediateRender: false }, ti);
      tl.fromTo(w + ' .guest', { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.3, immediateRender: false }, ti + 0.05);
      sfx('plink' + i, ti, 0.9);
    });
    T.light = tbel; T.boardBack = tbel + 0.64;
    tl.fromTo('#board', { scaleY: 1 }, { scaleY: 0, duration: 0.12, immediateRender: false }, tbel + 0.58);
    tl.to('#board', { scaleY: 1, duration: 0.35, ease: 'back.out(3)' }, tbel + 0.7);
    capIn('capVoll', tbel + 0.25);
    hop(B, tbel + 0.5, 22);
  })();

  /* ---------- Szene 8: Zusammenfassung ---------- */
  (function () {
    var t = at('Weitergeben') - 0.75;
    capOut('capVoll', t - 0.2);
    show('#L-recap', t);
    tl.fromTo('#L-recap', { x: 1920 }, { x: 0, duration: 0.6, ease: 'expo.inOut' }, t);
    tl.to('#L-street', { x: -1920, duration: 0.6, ease: 'expo.inOut' }, t);
    hideAt('#L-street', t + 0.6);
    sfx('whoosh', t + 0.05, 0.7);
    ['r1', 'r2', 'r3'].forEach(function (r, i) {
      var tw = [at('Weitergeben'), at('mitverdienen'), at('Leerstand', 1)][i];
      pop('#' + r + ' .ico', tw - 0.12, { rot: -40, dur: 0.55 });
      tl.fromTo('#' + r + ' text', { x: -60, opacity: 0 }, { x: 0, opacity: 1, duration: 0.55, ease: 'expo.out' }, tw - 0.06);
      sfx('thump', tw - 0.1, 0.8);
    });
    /* Netzwerk auf der Karte */
    tl.fromTo('#net', { opacity: 0, x: 60 }, { opacity: 1, x: 0, duration: 0.8, ease: 'expo.out', immediateRender: true }, t + 0.3);
    Object.keys(CITY).forEach(function (k, i) { pop('#np' + i, t + 0.5 + i * 0.07, { dur: 0.4 }); });
    NET_PAIRS.forEach(function (pr, i) {
      var ts = t + 0.9 + i * 0.36;
      tl.fromTo('#na' + i, { drawSVG: '0% 0%' }, { drawSVG: '0% 100%', duration: 0.7, ease: 'power2.inOut' }, ts);
      tl.fromTo('#nc' + i, { opacity: 0 }, { opacity: 1, duration: 0.1 }, ts);
      tl.to('#nc' + i, { motionPath: { path: arc(CITY[pr[0]], CITY[pr[1]], 0.3) }, duration: 0.7, ease: 'power2.inOut' }, ts);
      tl.to('#nc' + i, { opacity: 0, scale: 0.4, duration: 0.2 }, ts + 0.7);
      tl.to('#na' + i, { drawSVG: '100% 100%', duration: 0.5, ease: 'power2.in' }, ts + 0.8);
    });
    gsap.set('[id^=nc]', { opacity: 0 });
    /* Mehr aus jedem Kunden */
    var tm = at('So', 2) - 0.1;
    ['r1', 'r2', 'r3'].forEach(function (r, i) { tl.to('#' + r, { x: -900, opacity: 0, duration: 0.5, ease: 'power3.in' }, tm - 0.4 + i * 0.05); });
    sfx('whoosh', tm - 0.35, 0.5);
    capIn('capMehr', tm + 0.1, 0.1);
    tl.fromTo(CAPS.capMehr.querySelectorAll('.hl'), { '--hl': 0 }, { '--hl': 1, duration: 0.5, ease: 'power2.inOut', stagger: 0.12 }, at('jedem') + 0.1);
  })();

  /* ---------- Szene 9: Abschluss ---------- */
  var URL_TXT = 'monteurzimmerblick.de';
  (function () {
    var t = at('Monteurzimmerblick', 2) - 0.8;
    tl.set('#coverSq', { visibility: 'visible' }, t);
    tl.fromTo('#coverSq', { scale: 0, rotation: -90, borderRadius: '20px' }, { scale: 24, rotation: 0, borderRadius: '4px', duration: 0.5, ease: 'power3.in' }, t);
    sfx('whoosh', t, 0.8);
    var ts = t + 0.5;
    capOut('capMehr', ts - 0.5);
    hideAt('#L-recap', ts);
    show('#L-cta', ts);
    /* Zeichen schrumpft auf seinen Platz im Logo */
    tl.to('#coverSq', { scale: 1.46, x: function () { return MARK.x + 73 - 960; }, y: function () { return MARK.y + 73 - 540; }, borderRadius: '20px', duration: 0.55, ease: 'expo.out' }, ts);
    tl.set('#coverSq', { visibility: 'hidden' }, ts + 0.55);
    tl.fromTo('#ctaMark', { opacity: 0 }, { opacity: 1, duration: 0.01 }, ts + 0.54);
    tl.fromTo('#ctaLogo .t3', { scale: 0, transformOrigin: '50% 50%' }, { scale: 1, duration: 0.4, ease: 'back.out(2.5)' }, ts + 0.45);
    tl.fromTo('#ctaLogo .t2', { x: 30, opacity: 0 }, { x: 0, opacity: 1, duration: 0.3, ease: 'back.out(2)' }, ts + 0.6);
    tl.fromTo('#ctaLogo .t1', { x: 50, opacity: 0 }, { x: 0, opacity: 1, duration: 0.3, ease: 'back.out(2)' }, ts + 0.7);
    sfx('pop', ts + 0.5, 0.7);
    tl.fromTo('#wordClipR', { attr: { width: 0 } }, { attr: { width: 1400 }, duration: 0.8, ease: 'expo.inOut' }, ts + 0.55);
    tl.fromTo('#word', { x: -80 }, { x: 0, duration: 0.8, ease: 'expo.out' }, ts + 0.55);
    popChar(BC, ts + 0.9); popChar(WC, ts + 1.0);
    wave(BC, ts + 1.3, 2, 'F'); wave(WC, ts + 1.4, 2, 'F');
    var tb = at('kostenlos');
    pop('#ctaBtn', tb - 0.25, { from: 0.5 }); sfx('pop', tb - 0.25, 0.8);
    var tc = at('starten') + 0.25;
    press('#ctaBtn', tc); tap('#tap3', tc); sfx('click', tc, 0.9);
    var tu = at('auf') + 0.05, n = URL_TXT.length, dt = 1.3 / n;
    T.url = tu; T.urlDt = dt;
    for (var i = 1; i <= n; i += 2) sfx('type', tu + i * dt, 0.3);
    wave(WC, DURATION - 3.2, 2, 'F'); wave(BC, DURATION - 3.0, 2, 'F');
    tl.to({}, { duration: 0.01 }, DURATION);
  })();

  /* ================= Layout, das Messungen braucht ================= */
  function layoutCTA() {
    var word = $('word'), w = word.getComputedTextLength(), mark = 146, gap = 34, total = mark + gap + w;
    var x0 = (1920 - total) / 2;
    MARK.x = x0; MARK.y = 470 - 106;
    $('ctaMarkW').setAttribute('transform', 'translate(' + x0 + ',' + MARK.y + ') scale(1.46)');
    word.setAttribute('x', x0 + mark + gap);
    $('wordClipR').setAttribute('x', x0 + mark + gap - 20);
  }
  var GLASS = ['#win1', '#win2', '#win3', '#win4'].map(function (w) { return q(w + ' .glass'); });
  var lastUrl = -1;
  function states(t) {
    /* Fenster: kurz weiß beim Wort „Monteurzimmer“, grau während des Leerstands, dann wieder gelb */
    for (var i = 0; i < 4; i++) {
      var f = Y;
      if (t >= T.flash && t < T.flash + 0.2 + i * 0.07) f = WH;
      if (t >= T.flip && t < T.light + i * 0.16) f = G3;
      GLASS[i].setAttribute('fill', f);
    }
    $('boardTxt').textContent = (t >= T.flip && t < T.boardBack) ? 'ZIMMER FREI' : 'MONTEURZIMMER';
    var k = Math.max(0, Math.min(URL_TXT.length, Math.floor((t - T.url) / T.urlDt)));
    if (k !== lastUrl) { $('url').textContent = URL_TXT.slice(0, k); lastUrl = k; }
    var u = $('url'), w = k ? u.getComputedTextLength() : 0;
    $('caret').setAttribute('x', (960 + w / 2 + 6).toFixed(1));
    var on = t >= T.url - 0.1 && (t < T.url + 1.5 || Math.floor((t - T.url - 1.5) / 0.5) % 2 === 1);
    $('caret').setAttribute('opacity', on ? 1 : 0);
  }

  /* ================= Rendern ================= */
  var viewport = $('viewport'), stage = $('stage');
  function fit() {
    var s = viewport.clientWidth / 1920;
    stage.style.transform = 'scale(' + s + ')';
  }
  window.addEventListener('resize', fit);
  fit();

  function render(t) {
    t = Math.max(0, Math.min(DURATION, t));
    tl.seek(t, true);
    for (var i = 0; i < CHARS.length; i++) drawChar(CHARS[i], t);
    states(t);
    return t;
  }
  window.__render = render;
  window.__duration = DURATION;
  window.__cues = function () {
    return { voice: VO_SEGS.map(function (s) { return { from: s[0], to: s[1], at: s[2] }; }), sfx: SFX.slice().sort(function (a, b) { return a.t - b.t; }), duration: DURATION };
  };

  /* ================= Vorschau-Player ================= */
  var params = new URLSearchParams(location.search);
  var EXPORT = params.has('export');
  var player = $('player'), audio = $('audio'), cover = $('playCover'), fill = $('progFill'), timeEl = $('time'), btn = $('btnPlay');
  if (EXPORT) player.classList.add('export');
  var playing = false, t0 = 0, cur = 0, raf = 0;
  function fmt(s) { s = Math.floor(s); return Math.floor(s / 60) + ':' + ('0' + s % 60).slice(-2); }
  function ui() { fill.style.width = (cur / DURATION * 100) + '%'; timeEl.textContent = fmt(cur) + ' / ' + fmt(DURATION); }
  function loop() {
    if (!playing) return;
    cur = (performance.now() - t0) / 1000;
    if (cur >= DURATION) { cur = DURATION; render(cur); stop(); cover.classList.remove('hidden'); return; }
    render(cur); ui();
    raf = requestAnimationFrame(loop);
  }
  function play() {
    if (cur >= DURATION) cur = 0;
    playing = true; player.classList.remove('paused'); cover.classList.add('hidden'); btn.textContent = '❚❚';
    t0 = performance.now() - cur * 1000;
    try { audio.currentTime = cur; audio.play().catch(function () {}); } catch (e) {}
    raf = requestAnimationFrame(loop);
  }
  function stop() { playing = false; cancelAnimationFrame(raf); audio.pause(); player.classList.add('paused'); btn.textContent = '▶'; ui(); }
  cover.addEventListener('click', play);
  btn.addEventListener('click', function () { playing ? stop() : play(); });
  $('prog').addEventListener('click', function (e) {
    var r = this.getBoundingClientRect(), was = playing;
    stop(); cur = (e.clientX - r.left) / r.width * DURATION; render(cur); ui(); if (was) play();
  });
  document.addEventListener('keydown', function (e) { if (e.key === ' ') { e.preventDefault(); playing ? stop() : play(); } });

  window.__ready = document.fonts.ready.then(function () {
    layoutCTA();
    cur = params.has('t') ? parseFloat(params.get('t')) || 0 : 0;
    render(cur); ui();
    return true;
  });
})();
</script>
</body>
</html>
